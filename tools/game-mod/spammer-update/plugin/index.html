<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Packet Spammer</title>
  <style>
    :root {
      --bg: #0b0b0c; --panel: #111113; --line: #1f1f22; --line2: #2f2f34;
      --text: #ededee; --dim: #a6a6ac; --faint: #6c6c72; --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; padding: 16px; gap: 12px;
    }
    h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -0.2px; }
    .sub { color: var(--faint); font-size: 12px; margin-top: 2px; }
    textarea, select, input {
      background: var(--panel); color: var(--text); border: 1px solid var(--line2);
      border-radius: 9px; font: inherit; padding: 8px 10px; outline: none;
    }
    textarea:focus, select:focus, input:focus { border-color: #5a5a60; }
    textarea { width: 100%; min-height: 96px; resize: vertical; font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; }
    input[type=number] { width: 74px; }
    button {
      height: 34px; padding: 0 14px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer;
      background: transparent; color: var(--text); border: 1px solid var(--line2);
    }
    button:hover:not(:disabled) { border-color: #5a5a60; }
    button.primary { background: #f4f4f5; color: #0b0b0c; border: 0; }
    button.primary:hover:not(:disabled) { background: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    .sp { flex: 1; }
    .list { flex: 1; min-height: 80px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
    .empty { color: var(--faint); padding: 18px; text-align: center; font-size: 12.5px; }
    .step { display: grid; grid-template-columns: 18px 92px 1fr 78px 28px; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); }
    .step .grip { cursor: grab; color: var(--faint); user-select: none; text-align: center; font-size: 14px; letter-spacing: -2px; }
    .step.dragging { opacity: 0.4; }
    .step.drop-above { box-shadow: inset 0 2px 0 #a6a6ac; }
    .step.drop-below { box-shadow: inset 0 -2px 0 #a6a6ac; }
    .step select, .step input { height: 28px; padding: 3px 7px; border-radius: 7px; font-size: 12px; }
    .step input.pk { width: 100%; font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; }
    .step input.dl { width: 100%; }
    .step .dlw { display: flex; align-items: center; gap: 4px; color: var(--faint); font-size: 12px; }
    #io { display: none; flex-direction: column; gap: 8px; border: 1px solid var(--line2); border-radius: 12px; padding: 10px; }
    #io.open { display: flex; }
    #io textarea { min-height: 80px; }
    .hint { color: var(--faint); font-size: 12px; }
    .step:first-child { border-top: 0; }
    .step.active { background: #1a1a1d; }
    .step .to { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.4px; }
    .step code { font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step .delay { color: var(--faint); font-size: 12px; text-align: right; }
    .step button { width: 28px; height: 28px; padding: 0; border: 0; color: var(--faint); font-weight: 400; }
    .step button:hover { color: var(--text); }
    #status { font-size: 12px; color: var(--faint); min-height: 18px; }
    #status.error { color: var(--bad); }
  </style>
</head>
<body>
  <div>
    <h1>Packet Spammer</h1>
    <div class="sub">One packet per line. <code>{room}</code> becomes your current room. In the list: drag ⋮⋮ to reorder, change any line in place.</div>
  </div>

  <textarea id="packets" spellcheck="false" placeholder="%xt%o%qat%{room}%questready%0%"></textarea>

  <div class="row">
    <label>Send to
      <select id="to">
        <option value="server">Server</option>
        <option value="game">My game only</option>
      </select>
    </label>
    <label>Wait <input id="delay" type="number" min="0.05" step="0.05" value="1"> s</label>
    <span class="sp"></span>
    <button id="add">Add to list</button>
    <button id="send" class="primary">Send now</button>
  </div>

  <div class="list" id="list"></div>

  <div class="row">
    <label><input id="loop" type="checkbox"> Repeat the list</label>
    <span class="sp"></span>
    <button id="import">Import</button>
    <button id="export">Export</button>
    <button id="clear">Clear list</button>
    <button id="stop" disabled>Stop</button>
    <button id="run" class="primary">Run list</button>
  </div>

  <div id="io">
    <div class="hint">Paste a list (or choose a file). One packet per line: <code>server 1 %xt%...%</code> or <code>game 0.5 %xt%...%</code>; plain packets go to the server with a 1 s wait.</div>
    <textarea id="ioText" spellcheck="false"></textarea>
    <div class="row">
      <button id="ioFile">Choose file…</button>
      <input id="ioPick" type="file" accept=".txt,.json,text/plain,application/json" style="display:none">
      <span class="sp"></span>
      <button id="ioCancel">Cancel</button>
      <button id="ioAdd">Add to list</button>
      <button id="ioReplace" class="primary">Replace list</button>
    </div>
  </div>
  <div id="status"></div>

  <script src="runner.js"></script>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id)
      const jam = window.jam || await new Promise(resolve => {
        const t = setInterval(() => { if (window.jam) { clearInterval(t); resolve(window.jam) } }, 25)
      })
      const { dispatch } = jam
      const { splitPackets, sendOne, run, toText, fromText } = window.SpammerRunner

      // Saved per JR profile.
      const store = jam.storage || {
        get: (k, d) => { try { const v = localStorage.getItem('spammer.' + k); return v === null ? d : JSON.parse(v) } catch (_) { return d } },
        set: (k, v) => { try { localStorage.setItem('spammer.' + k, JSON.stringify(v)) } catch (_) {} }
      }

      let steps = await store.get('steps', [])
      if (!Array.isArray(steps)) steps = []
      let runner = null
      let drag = -1

      const setStatus = (text, isError) => {
        $('status').textContent = text || ''
        $('status').className = isError ? 'error' : ''
      }
      const save = () => store.set('steps', steps)
      const label = (to) => (to === 'game' ? 'Game' : 'Server')

      function render (active = -1) {
        const list = $('list')
        list.textContent = ''
        if (!steps.length) {
          const empty = document.createElement('div')
          empty.className = 'empty'
          empty.textContent = 'Your list is empty. Type packets above and press Add to list.'
          list.appendChild(empty)
        }
        steps.forEach((step, i) => {
          const row = document.createElement('div')
          row.className = 'step' + (i === active ? ' active' : '')
          const busy = !!runner
          // drag handle: drag a line by it to move it
          const grip = document.createElement('span')
          grip.className = 'grip'
          grip.textContent = '⋮⋮'
          grip.title = 'Drag to move'
          row.draggable = false
          grip.onmousedown = () => { if (!busy) row.draggable = true }
          row.ondragstart = (e) => { drag = i; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)) } catch (_) {} }
          row.ondragend = () => { drag = -1; row.draggable = false; render() }
          row.ondragover = (e) => {
            if (drag < 0 || busy) return
            e.preventDefault()
            const r = row.getBoundingClientRect()
            const below = e.clientY > r.top + r.height / 2
            row.classList.toggle('drop-above', !below)
            row.classList.toggle('drop-below', below)
          }
          row.ondragleave = () => row.classList.remove('drop-above', 'drop-below')
          row.ondrop = (e) => {
            e.preventDefault()
            if (drag < 0 || busy) return
            const r = row.getBoundingClientRect()
            let to = e.clientY > r.top + r.height / 2 ? i + 1 : i
            const [moved] = steps.splice(drag, 1)
            if (drag < to) to--
            steps.splice(to, 0, moved)
            drag = -1
            save()
            render()
          }
          // where it goes
          const to = document.createElement('select')
          to.innerHTML = '<option value="server">Server</option><option value="game">My game</option>'
          to.value = step.to === 'game' ? 'game' : 'server'
          to.disabled = busy
          to.onchange = () => { step.to = to.value; save() }
          // the packet
          const code = document.createElement('input')
          code.className = 'pk'
          code.value = step.text
          code.title = step.text
          code.spellcheck = false
          code.disabled = busy
          code.onchange = () => {
            const text = code.value.trim()
            if (!text) { code.value = step.text; return setStatus('A line needs a packet. Use ✕ to remove it.', true) }
            step.text = text
            code.title = text
            save()
          }
          // the wait after it
          const dlw = document.createElement('span')
          dlw.className = 'dlw'
          const delay = document.createElement('input')
          delay.className = 'dl'
          delay.type = 'number'
          delay.min = String(window.SpammerRunner.MIN_DELAY)
          delay.step = '0.05'
          delay.value = String(step.delay)
          delay.disabled = busy
          delay.onchange = () => { step.delay = Math.max(window.SpammerRunner.MIN_DELAY, Number(delay.value) || 1); delay.value = String(step.delay); save() }
          dlw.append(delay, 's')
          const remove = document.createElement('button')
          remove.title = 'Remove'
          remove.textContent = '✕'
          remove.disabled = busy
          remove.onclick = () => { steps.splice(i, 1); save(); render() }
          row.append(grip, to, code, dlw, remove)
          list.appendChild(row)
        })
        $('run').disabled = !!runner || !steps.length
        $('stop').disabled = !runner
        $('clear').disabled = !!runner || !steps.length
        $('export').disabled = !steps.length
        $('import').disabled = !!runner
      }

      $('packets').addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault()
          const t = e.target
          const s = t.selectionStart
          t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd)
          t.selectionStart = t.selectionEnd = s + 2
        }
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('send').click()
      })

      $('send').onclick = async () => {
        const packets = splitPackets($('packets').value)
        if (!packets.length) return setStatus('Type a packet first.', true)
        try {
          for (const text of packets) await sendOne(dispatch, $('to').value, text)
          setStatus(`Sent ${packets.length} packet${packets.length === 1 ? '' : 's'}.`)
        } catch (error) {
          setStatus(error.message, true)
        }
      }

      $('add').onclick = () => {
        const packets = splitPackets($('packets').value)
        if (!packets.length) return setStatus('Type a packet first.', true)
        const delay = Math.max(window.SpammerRunner.MIN_DELAY, Number($('delay').value) || 1)
        for (const text of packets) steps.push({ to: $('to').value, text, delay })
        save()
        render()
        setStatus('')
      }

      $('clear').onclick = () => { steps = []; save(); render() }
      $('export').onclick = () => {
        const text = toText(steps)
        try { require('electron').clipboard.writeText(text) } catch (_) { try { navigator.clipboard.writeText(text) } catch (_) {} }
        const a = document.createElement('a')
        a.href = URL.createObjectURL(new Blob([text + '\n'], { type: 'text/plain' }))
        a.download = 'packet-list.txt'
        document.body.appendChild(a)
        a.click()
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 1000)
        setStatus(`Exported ${steps.length} line${steps.length === 1 ? '' : 's'} (saved as packet-list.txt and copied).`)
      }
      $('import').onclick = () => {
        $('io').classList.toggle('open')
        if ($('io').classList.contains('open')) {
          let clip = ''
          try { clip = require('electron').clipboard.readText() } catch (_) {}
          if (!$('ioText').value && fromText(clip).length) $('ioText').value = clip
          $('ioText').focus()
        }
      }
      $('ioCancel').onclick = () => { $('io').classList.remove('open') }
      $('ioFile').onclick = () => $('ioPick').click()
      $('ioPick').onchange = async (e) => {
        const f = e.target.files[0]
        e.target.value = ''
        if (f) $('ioText').value = await f.text()
      }
      const doImport = (replace) => {
        const got = fromText($('ioText').value)
        if (!got.length) return setStatus('Nothing to import: paste a list or choose a file.', true)
        steps = replace ? got : steps.concat(got)
        save()
        render()
        $('io').classList.remove('open')
        $('ioText').value = ''
        setStatus(`${replace ? 'Replaced the list with' : 'Added'} ${got.length} line${got.length === 1 ? '' : 's'}.`)
      }
      $('ioAdd').onclick = () => doImport(false)
      $('ioReplace').onclick = () => doImport(true)
      // the game's Packet Spammer window uses the same list: pick up its changes
      window.addEventListener('focus', async () => {
        if (runner || drag >= 0) return
        const fresh = await store.get('steps', [])
        if (Array.isArray(fresh) && JSON.stringify(fresh) !== JSON.stringify(steps)) { steps = fresh; render() }
      })

      $('run').onclick = () => {
        if (!steps.length) return
        setStatus($('loop').checked ? 'Running on repeat…' : 'Running…')
        runner = run(dispatch, steps.slice(), {
          loop: $('loop').checked,
          onStep: (i) => render(i),
          onError: (error) => setStatus(error.message, true),
          onDone: () => {
            runner = null
            render()
            if ($('status').className !== 'error') setStatus('Finished.')
          }
        })
        render(0)
      }

      $('stop').onclick = () => { if (runner) runner.stop() }
      window.addEventListener('beforeunload', () => { if (runner) runner.stop() })

      render()
    })().catch((error) => {
      // If setup fails, say so instead of leaving buttons that do nothing.
      const status = document.getElementById('status')
      status.textContent = "Packet Spammer couldn't start: " + error.message
      status.className = 'error'
      try { window.jam.application.consoleMessage({ type: 'error', message: 'Packet Spammer: ' + error.message }) } catch (_) {}
    })
  </script>
</body>
</html>
